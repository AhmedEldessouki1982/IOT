services:
  # Mosquitto MQTT broker.
  #
  # NOTE: `allow_anonymous true` in /mosquitto/config/mosquitto.conf is for
  # LOCAL DEV ONLY. Before any real deployment it MUST be replaced with
  # username/password authentication and/or TLS certs.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config